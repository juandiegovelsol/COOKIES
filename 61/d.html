<!DOCTYPE html>
<html>
  <head>
    <title>Pong</title>
    <style>
      body {
        margin: 0;
        background: #000;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      canvas {
        border: 2px solid #fff;
      }
    </style>
  </head>
  <body>
    <canvas id="c" width="800" height="400"></canvas>
    <script>
      let c = document.getElementById("c");
      let x = c.getContext("2d");
      let b = { x: 400, y: 200, dx: 5, dy: 3 };
      let p1 = { x: 20, y: 150 };
      let p2 = { x: 770, y: 150 };
      let s1 = 0;
      let s2 = 0;

      let k = {};
      document.onkeydown = (e) => (k[e.key] = true);
      document.onkeyup = (e) => (k[e.key] = false);

      function u() {
        // Player 1 controls
        if (k["w"] && p1.y > 0) p1.y -= 7;
        if (k["s"] && p1.y < 300) p1.y += 7;

        // Player 2 controls
        if (k["ArrowUp"] && p2.y > 0) p2.y -= 7;
        if (k["ArrowDown"] && p2.y < 300) p2.y += 7;

        b.x += b.dx;
        b.y += b.dy;

        // Ball interaction with paddles
        if (b.y <= 0 || b.y >= 390) b.dy = -b.dy;
        if (b.x <= 40 && b.y >= p1.y && b.y <= p1.y + 100) b.dx = -b.dx;
        if (b.x >= 760 && b.y >= p2.y && b.y <= p2.y + 100) b.dx = -b.dx;

        // Score tracking
        if (b.x <= 0) {
          s2++;
          b.x = 400;
          b.y = 200;
          b.dx = 5;
        }
        if (b.x >= 800) {
          s1++;
          b.x = 400;
          b.y = 200;
          b.dx = -5;
        }

        // Drawing
        x.fillStyle = "#000";
        x.fillRect(0, 0, 800, 400);
        x.fillStyle = "#fff";
        x.fillRect(p1.x, p1.y, 10, 100);
        x.fillRect(p2.x, p2.y, 10, 100);
        x.fillRect(b.x, b.y, 10, 10);
        x.font = "30px Arial";
        x.fillText(s1, 200, 50);
        x.fillText(s2, 600, 50);
        for (let i = 0; i < 400; i += 20) x.fillRect(397, i, 6, 10);

        requestAnimationFrame(u);
      }

      requestAnimationFrame(u);
    </script>
  </body>
</html>
