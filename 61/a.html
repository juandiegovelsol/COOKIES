<!DOCTYPE html>
<html>
  <head>
    <title>Pong</title>
    <style>
      body {
        margin: 0;
        background: #000;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      canvas {
        border: 2px solid #fff;
      }
    </style>
  </head>
  <body>
    <canvas id="c" width="800" height="400"></canvas>
    <script>
      let c = document.getElementById("c"),
        x = c.getContext("2d"),
        b = { x: 400, y: 200, dx: 5, dy: 3 },
        p1 = { x: 20, y: 150 },
        p2 = { x: 770, y: 150 },
        s1 = 0,
        s2 = 0,
        k = {};
      document.onkeydown = (e) => {
        [k] = e.key;
      };
      document.onkeyup = (e) => {
        [k] = e.key;
      };

      function u() {
        if (k === "w" && p1.y + p1.dy > 0) p1.y += p1.dy;
        if (k === "s" && p1.y + p1.dy < 400) p1.y += p1.dy;
        if (k === "ArrowUp" && p2.y + p2.dy > 0) p2.y += p2.dy;
        if (k === "ArrowDown" && p2.y + p2.dy < 400) p2.y += p2.dy;

        if (b.x > 800) {
          s1++;
          b.x = 400;
          b.y = 200;
          b.dx = 5;
          b.dy = 5;
        }
        if (b.x < 0) {
          s2++;
          b.x = 400;
          b.y = 200;
          b.dx = -5;
          b.dy = 5;
        }

        if (b.y > 400) b.dy = -b.dy;
        if (b.y < 0) b.dy = -b.dy;

        b.x += b.dx;
        b.y += b.dy;

        if (
          b.y < p1.y + p1.h &&
          b.y + b.h > p1.y &&
          b.x < p1.x + p1.w &&
          b.x + b.w > p1.x
        ) {
          b.dx = -b.dx;
          b.dy += (b.y + b.h / 2 - (p1.y + p1.h / 2)) * 0.05;
        }
        if (
          b.y < p2.y + p2.h &&
          b.y + b.h > p2.y &&
          b.x + b.w > p2.x &&
          b.x < p2.x + p2.w
        ) {
          b.dx = -b.dx;
          b.dy += (b.y + b.h / 2 - (p2.y + p2.h / 2)) * 0.05;
        }

        x.fillStyle = "#0000";
        x.fillRect(0, 0, 800, 400);
        x.fillStyle = "#fff";
        x.fillRect(p1.x, p1.y, p1.w, p1.h);
        x.fillRect(p2.x, p2.y, p2.w, p2.h);
        x.beginPath();
        x.arc(b.x + b.w / 2, b.y + b.h / 2, b.r, 0, Math.PI * 2);
        x.fill();
        x.fillStyle = "30px Arial";
        x.font = "30px Arial";
        x.fillText(s1, 200, 50);
        x.fillText(s2, 600, 50);

        for (let i = 0; i < 400; i += 20) {
          x.fillRect(397, i, 6, 10);
        }

        u();
      }
    </script>
  </body>
</html>
