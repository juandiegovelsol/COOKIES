<!DOCTYPE html>
<html>
  <head>
    <style>
      body {
        text-align: center;
        margin: 50px;
      }
      .word-container {
        display: flex;
        gap: 5px;
        justify-content: center;
        margin: 20px;
      }
      .letter-box {
        width: 40px;
        height: 40px;
        border: 1px solid #000;
        text-align: center;
        font-size: 20px;
      }
      button {
        padding: 5px 10px;
        margin: 5px;
      }
      .correct {
        background: #0f0;
      }
      .incorrect {
        background: #f00;
      }
    </style>
  </head>
  <body>
    <div id="hint"></div>
    <div class="word-container" id="wordContainer"></div>
    <button onclick="check()">Check</button>
    <button onclick="newWord()">New</button>
    <div id="msg"></div>
    <script>
      const words = [
        ["CAT", "Animal"],
        ["DOG", "Pet"],
        ["SUN", "Star"],
        ["MOON", "Night"],
        ["BOOK", "Read"],
      ];
      let w = "";
      function newWord() {
        const r = words[Math.floor(Math.random() * words.length)];
        w = r[0];
        document.getElementById("hint").textContent = r[1];
        document.getElementById("msg").textContent = "";
        const c = document.getElementById("wordContainer");
        c.innerHTML = "";
        for (let i = 0; i < w.length; i++) {
          const input = document.createElement("input");
          input.className = "letter-box";
          input.maxLength = 1; // Set maxLength to 1
          input.onkeyup = (e) =>
            (e.target.value = e.target.value.toUpperCase());
          c.appendChild(input);
        }
      }
      function check() {
        const inputs = document.querySelectorAll(".letter-box");
        let u = "";
        inputs.forEach((i) => (u += i.value));
        const m = document.getElementById("msg");
        if (u === w) {
          m.textContent = "Correct!";
          inputs.forEach((i) => (i.className = "letter-box correct"));
        } else {
          m.textContent = "Wrong!";
          inputs.forEach((i) => (i.className = "letter-box incorrect"));
          setTimeout(
            () => inputs.forEach((i) => (i.className = "letter-box")),
            1000
          );
        }
      }
      newWord();
    </script>
  </body>
</html>
